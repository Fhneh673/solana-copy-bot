[package]
name = "copybot-core"
version = "0.1.0"
edition = "2021"
description = "Быстрое ядро copy-trading бота: WebSocket-слежение, разбор свопов, Jupiter, подпись и отправка"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bs58 = "0.5"
ed25519-dalek = "2"
anyhow = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
